<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>GWA Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#667;--ac:#3b5bdb;--bd:#dde1ea;--er:#c92a2a;--ok:#2b8a3e;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--card:#1c1f28;--tx:#e8eaf0;--mu:#9aa;--ac:#748ffc;--bd:#2c303c;--er:#ff8787;--ok:#69db7c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141a;--card:#1c1f28;--tx:#e8eaf0;--mu:#9aa;--ac:#748ffc;--bd:#2c303c;--er:#ff8787;--ok:#69db7c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:14px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr);align-items:start}
main>header,main>section:first-of-type{grid-column:1/-1}
main .card,main>header{margin:0}
h1{font-size:1.3rem;margin:0}h2{font-size:1rem;margin:0 0 10px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:1.5rem;color:var(--ac)}.stats span{color:var(--mu);font-size:.8rem}
button,select,input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button.d{color:var(--er)}
.row{display:grid;grid-template-columns:1fr 1fr 34px;gap:6px;margin-bottom:6px}
.row input,.row select{width:100%;min-width:0;padding:8px 6px}
.bad{border-color:var(--er)!important}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.msg{min-height:1.2em;font-size:.85rem;margin-top:6px}.msg.e{color:var(--er)}.msg.o{color:var(--ok)}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:6px;border-bottom:1px solid var(--bd);font-size:.9rem}
.mu{color:var(--mu)}
.hid{display:none}
@media (min-width:900px){main{grid-template-columns:repeat(2,minmax(0,1fr));padding:24px}h1{font-size:1.6rem}.stats b{font-size:2rem}}
@media (max-width:520px){main{padding:10px}.stats b{font-size:1.2rem}.row{grid-template-columns:1fr 1fr 40px}.row.mu{display:none}.row input[data-k=n]{grid-column:1/-1}input,select,button{font-size:16px}button{min-height:40px}.bar button{flex:1 1 auto}th,td{padding:6px 4px}}
@media print{body{background:#fff;color:#000}.np{display:none!important}.card{border:0;padding:0}.stats b{color:#000}}
</style></head><body><main>
<header><h1>📊 GWA Calculator</h1><button class="np" id="th">🌓 Theme</button></header>

<section class="card"><div class="stats"><div><b id="gwa">–</b><span>GWA</span></div><div><b id="tu">0</b><span>Total units</span></div><div><b id="wp">0</b><span>Weighted points</span></div></div>
<div class="bar np"><button class="p" id="hist">Save to history</button><button id="csv">Export CSV</button><button id="prt">Print report</button></div></section>

<section class="card np"><h2>Add subjects</h2>
<div class="row mu"><span>Units</span><span>Grade</span><span></span></div>
<div id="draft"></div>
<div class="bar"><button id="add">+ Add row</button><button class="p" id="save">Save completed rows</button></div>
<div class="msg" id="m1"></div></section>

<section class="card np"><h2>Scan grades (OCR)</h2>
<div class="bar"><button class="p" id="cam">📷 Use camera</button><button id="up">🖼️ Upload image</button></div>
<input type="file" id="img" accept="image/*" capture="environment" hidden><input type="file" id="img2" accept="image/*" hidden>
<img id="pv" class="hid" alt="Preview" style="max-width:100%;max-height:200px;margin-top:8px;border-radius:8px">
<div class="msg mu" id="m2">Take a photo or upload an image of your grade sheet. Results are editable before importing.</div>
<div id="ocr"></div><div class="bar hid" id="ocrb"><button class="p" id="imp">Import rows</button><button id="oadd">+ Add row</button><button id="clr">Discard</button></div></section>

<section class="card"><h2>Saved subjects</h2><div class="wrap"><table><thead><tr><th>#</th><th>Units</th><th>Grade</th><th>Pts</th><th class="np"></th></tr></thead><tbody id="list"></tbody></table></div></section>

<section class="card np"><h2>History</h2><div id="hl" class="mu">No records yet.</div>
<div class="bar"><button class="d" id="hc">Clear history</button><button class="d" id="ra">Reset all data</button></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
const G=[];for(let i=16;i>=0;i--)G.push((i/4).toFixed(2));
let saved=[],draft=[{n:"",u:"",g:""}],ocr=[],hist=[];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function load(){try{const d=JSON.parse(localStorage.getItem("gwa")||"{}");saved=d.saved||[];hist=d.hist||[];if(d.theme)document.documentElement.dataset.theme=d.theme}catch(e){}}
function store(){try{localStorage.setItem("gwa",JSON.stringify({saved,hist,theme:document.documentElement.dataset.theme||""}))}catch(e){}}
function rowsHTML(arr,bad){return arr.map((r,i)=>`<div class="row"><input data-i="${i}" data-k="u" type="number" min="0.5" max="12" step="0.5" value="${esc(r.u)}" class="${bad&&bad[i]&&!(+r.u>0&&+r.u<=12)?'bad':''}"><select data-i="${i}" data-k="g" class="${(bad&&bad[i]&&r.g==='')||r.w?'bad':''}"><option value="">–</option>${G.map(g=>`<option ${r.g===g?'selected':''}>${g}</option>`).join("")}</select><button class="d" data-del="${i}">✕</button></div>`).join("")}
function bind(el,arr,rerender){
 el.oninput=e=>{const t=e.target;if(t.dataset.k)arr[t.dataset.i][t.dataset.k]=t.value};
 el.onchange=e=>{if(e.target.dataset.k)arr[e.target.dataset.i][e.target.dataset.k]=e.target.value};
 el.onclick=e=>{const d=e.target.dataset.del;if(d!==undefined){arr.splice(+d,1);rerender()}}}
function rDraft(bad){$("draft").innerHTML=rowsHTML(draft,bad)}
function rOcr(){$("ocr").innerHTML=rowsHTML(ocr);$("ocrb").classList.toggle("hid",!ocr.length)}
const valid=r=>+r.u>0&&+r.u<=12&&G.includes(r.g);
const f=(n,d=2)=>(Math.round(n*100)/100).toFixed(d).replace(/\.?0+$/,m=>d?m:"");
function calc(){const u=saved.reduce((a,s)=>a+ +s.u,0),w=saved.reduce((a,s)=>a+s.u*s.g,0);return{u,w,g:u?w/u:null}}
function rAll(){
 const c=calc();$("gwa").textContent=c.g===null?"–":c.g.toFixed(4);$("tu").textContent=+c.u.toFixed(2);$("wp").textContent=+c.w.toFixed(2);
 $("list").innerHTML=saved.length?saved.map((s,i)=>`<tr><td>${i+1}</td><td>${s.u}</td><td>${(+s.g).toFixed(2)}</td><td>${+(s.u*s.g).toFixed(2)}</td><td class="np"><button data-e="${i}">Edit</button> <button class="d" data-x="${i}">✕</button></td></tr>`).join(""):'<tr><td colspan="5" class="mu">No saved subjects.</td></tr>';
 $("hl").innerHTML=hist.length?hist.map((h,i)=>`<div class="row" style="grid-template-columns:1fr auto"><span>${esc(h.d)} — <b>${h.g.toFixed(4)}</b> (${h.u} units, ${h.s} subjects)</span><button class="d" data-h="${i}">✕</button></div>`).join(""):"No records yet.";
 store()}
function msg(id,t,c){$(id).textContent=t;$(id).className="msg "+(c||"")}
$("add").onclick=()=>{draft.push({n:"",u:"",g:""});rDraft()};
$("save").onclick=()=>{
 const filled=draft.filter(r=>r.n||r.u||r.g);
 if(!filled.length)return msg("m1","Nothing to save. Fill in at least one row.","e");
 const ok=draft.filter(valid),bad=draft.map(r=>(r.n||r.u||r.g)&&!valid(r));
 saved.push(...ok.map(r=>({n:r.n.trim(),u:+r.u,g:+r.g})));
 draft=draft.filter((r,i)=>bad[i]);if(!draft.length)draft=[{n:"",u:"",g:""}];
 rDraft(bad.filter(Boolean).length?draft.map(()=>true):null);rAll();
 const nb=bad.filter(Boolean).length;
 msg("m1",(ok.length?`Saved ${ok.length} subject(s). `:"")+(nb?`${nb} incomplete row(s) kept: needs units (0.5–12) and a grade.`:""),nb?"e":"o")};
$("list").onclick=e=>{const t=e.target;
 if(t.dataset.x!==undefined){saved.splice(+t.dataset.x,1);rAll()}
 if(t.dataset.e!==undefined){const s=saved.splice(+t.dataset.e,1)[0];const r={n:s.n,u:String(s.u),g:(+s.g).toFixed(2)};
  if(draft.length===1&&!draft[0].n&&!draft[0].u&&!draft[0].g)draft=[r];else draft.push(r);rDraft();rAll();msg("m1","Subject moved to the entry list for editing. Save it again when done.","o")}};
$("hist").onclick=()=>{const c=calc();if(c.g===null)return alert("Save at least one subject first.");
 hist.unshift({d:new Date().toLocaleString(),g:c.g,u:+c.u.toFixed(2),s:saved.length});rAll()};
$("hl").onclick=e=>{if(e.target.dataset.h!==undefined){hist.splice(+e.target.dataset.h,1);rAll()}};
$("hc").onclick=()=>{if(confirm("Clear all history?")){hist=[];rAll()}};
$("ra").onclick=()=>{if(confirm("Delete ALL saved subjects and history?")){saved=[];hist=[];rAll()}};
$("csv").onclick=()=>{if(!saved.length)return alert("No subjects to export.");const c=calc();
 const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
 const rows=[["#","Units","Grade","Weighted points"],...saved.map((s,i)=>[i+1,s.u,(+s.g).toFixed(2),s.u*s.g]),[],["Total units",c.u],["Weighted points",c.w],["GWA",c.g.toFixed(4)]];
 const txt=rows.map(r=>r.join(",")).join("\n");
 (async()=>{try{const d=window.claude&&await claude.use("downloads");if(d){await d.save({filename:"gwa.csv",data:txt});return}}catch(e){}
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/csv"}));a.download="gwa.csv";a.click()})()};
$("prt").onclick=()=>window.print();
$("th").onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark";store()};
// OCR
function parse(text){const out=[];
 text.split(/\n/).forEach(l=>{l=l.trim();if(l.length<4)return;
  const nums=(l.match(/\d+(?:[.,]\d+)?/g)||[]).map(x=>x.replace(",","."));
  const gi=[...nums].reverse().findIndex(x=>G.includes((+x).toFixed(2))&&/\./.test(x));
  if(gi<0||nums.length<2)return;
  const g=(+nums[nums.length-1-gi]).toFixed(2);const rest=nums.filter((x,i)=>i!==nums.length-1-gi);
  const u=rest.find(x=>+x>0&&+x<=12&&!/\./.test(x))||rest.find(x=>+x>0&&+x<=12);
  if(!u)return;
  const n=l.replace(/\d+(?:[.,]\d+)?/g," ").replace(/[^A-Za-z&\-\s]/g," ").replace(/\s+/g," ").trim();
  out.push({n,u:String(+u),g})});return out}
function loadT(){return new Promise((res,rej)=>{if(window.Tesseract)return res();const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js";s.onload=res;s.onerror=()=>rej();document.head.appendChild(s)})}
async function viaClaude(file){
 const s=await claude.use("sample");if(!s)return null;
 const lim=await s.limits();if(!lim||!lim.images)return null;
 const bmp=await createImageBitmap(file);const k=Math.min(1,2200/Math.max(bmp.width,bmp.height));
 const cv=document.createElement("canvas");cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
 const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",.85));
 const v=await s.json("Read the attached grade sheet image. Return ONLY a JSON array of objects {\"n\":subject name or code,\"u\":units as a number,\"g\":grade as a number}. Extract EVERY row of the table from top to bottom without skipping any (there may be 10 or more). Use the Units column and the Final Grade column only. Return [] if none.",{images:[blob],modelTier:"complex"});
 return (Array.isArray(v)?v:[]).map(r=>({n:String(r.n||""),u:String(+r.u||""),g:(+r.g).toFixed(2)})).filter(r=>+r.u>0&&G.includes(r.g))}
async function prep(file){const b=await createImageBitmap(file);const k=Math.min(3,3600/Math.max(b.width,b.height));const c=document.createElement("canvas");c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);const x=c.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(b,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height),p=d.data;for(let i=0;i<p.length;i+=4){let v=p[i]*.3+p[i+1]*.59+p[i+2]*.11;v=Math.max(0,Math.min(255,(v-128)*1.5+128));p[i]=p[i+1]=p[i+2]=v}x.putImageData(d,0,0);return c}
function snap(t){
 t=t.replace(/^[^\w]+|[^\w]+$/g,"").replace(/[,:;]/g,".");
 if(/^\d{3}$/.test(t)){const n=+t/100;return n<=4&&n*4===Math.round(n*4)?{g:n.toFixed(2),w:false}:null}
 t=t.replace(/[Ss]/g,"5").replace(/[Oo]/g,"0").replace(/[Il|]/g,"1").replace(/B/g,"8");
 if(!/^\d\.\d{1,2}$/.test(t))return null;
 const n=+t;if(n>4)return null;const q=Math.round(n*4)/4;
 return{g:q.toFixed(2),w:Math.abs(q-n)>.001}}
function parseWords(ws){
 const T=ws.map(w=>({t:w.text.trim(),x:w.bbox.x0,y:(w.bbox.y0+w.bbox.y1)/2,h:w.bbox.y1-w.bbox.y0,wd:w.bbox.x1-w.bbox.x0})).filter(w=>w.t);
 let gs=[];T.forEach(w=>{const s=snap(w.t);if(s)gs.push({...w,...s})});
 if(gs.length>2){const xs=gs.map(g=>g.x).sort((a,b)=>a-b),mx=xs[xs.length>>1],mw=gs.map(g=>g.wd).sort((a,b)=>a-b)[gs.length>>1];gs=gs.filter(g=>Math.abs(g.x-mx)<mw*2.5)}
 gs.sort((a,b)=>a.y-b.y);
 const us=T.filter(w=>/^\d{1,2}$/.test(w.t)&&+w.t>0&&+w.t<=12),used=new Set(),out=[];
 gs.forEach(g=>{const c=us.filter(u=>u.x<g.x&&!used.has(u)&&Math.abs(u.y-g.y)<Math.max(g.h,u.h)*1.2).sort((a,b)=>Math.abs(a.y-g.y)-Math.abs(b.y-g.y))[0];
  if(c)used.add(c);out.push({n:"",u:c?c.t:"",g:g.g,w:g.w||!c})});
 const f=out.filter(r=>r.u).map(r=>r.u),m=f.sort((a,b)=>f.filter(v=>v===b).length-f.filter(v=>v===a).length)[0]||"3";
 out.forEach(r=>{if(!r.u)r.u=m});
 return out}
async function viaTess(file){await loadT();const c=await prep(file);const w=await Tesseract.createWorker("eng");let best=[];
 try{for(const m of["6","11"]){await w.setParameters({tessedit_pageseg_mode:m});const r=await w.recognize(c);let rows=r.data.words?parseWords(r.data.words):[];if(!rows.length)rows=parse(r.data.text);if(rows.length>best.length)best=rows}}finally{await w.terminate()}return best}
async function scan(file){
 if(!file)return;
 if(!file.type.startsWith("image/"))return msg("m2","Please choose an image file.","e");
 $("pv").src=URL.createObjectURL(file);$("pv").classList.remove("hid");
 let rows=null,eng="Claude";
 try{msg("m2","Reading image…");rows=window.claude?await viaClaude(file):null}catch(e){rows=null}
 if(!rows){eng="Tesseract";try{msg("m2","Loading OCR engine…");await loadT();msg("m2","Reading image…");rows=await viaTess(file)}catch(e){return msg("m2","Scanning is unavailable right now. Please enter subjects manually.","e")}}
 ocr=rows;rOcr();
 if(!rows.length)msg("m2","No subject rows detected. Try a clearer, well-lit photo or enter grades manually.","e");
 else msg("m2",`Found ${rows.length} row(s) via ${eng}. Compare with your sheet${rows.some(r=>r.w)?" (red-outlined rows are uncertain)":""}, add any missing rows, then import.`,"o")}
$("cam").onclick=()=>$("img").click();$("up").onclick=()=>$("img2").click();
$("img").onchange=$("img2").onchange=e=>{scan(e.target.files[0]);e.target.value=""};
$("imp").onclick=()=>{if(draft.length===1&&!draft[0].n&&!draft[0].u&&!draft[0].g)draft=[];draft.push(...ocr.map(r=>({n:r.n,u:r.u,g:r.g})));ocr=[];rOcr();rDraft();msg("m1","OCR rows imported. Fix any highlighted fields, then save.","o")};
$("clr").onclick=()=>{ocr=[];rOcr()};$("oadd").onclick=()=>{ocr.push({n:"",u:"",g:""});rOcr()};
bind($("draft"),draft,()=>rDraft());bind($("ocr"),ocr,rOcr);
// arrays are reassigned in places; rebind via getters
$("draft").onclick=e=>{const d=e.target.dataset.del;if(d!==undefined){draft.splice(+d,1);if(!draft.length)draft=[{n:"",u:"",g:""}];rDraft()}};
$("draft").oninput=$("draft").onchange=e=>{const t=e.target;if(t.dataset.k)draft[t.dataset.i][t.dataset.k]=t.value};
$("ocr").onclick=e=>{const d=e.target.dataset.del;if(d!==undefined){ocr.splice(+d,1);rOcr()}};
$("ocr").oninput=$("ocr").onchange=e=>{const t=e.target;if(t.dataset.k){ocr[t.dataset.i][t.dataset.k]=t.value;delete ocr[t.dataset.i].w}};
load();rDraft();rOcr();rAll();
</script></body></html>
