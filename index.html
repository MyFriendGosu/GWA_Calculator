.row input,.row select{width:100%;min-width:0}

.mu{color:var(--mu)}
button i.sun{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button i.moon{display:none}:root:not([data-theme="light"]) button i.sun{display:inline-flex}}

function snap(t){
 t=t.replace(/^[^\w]+|[^\w]+$/g,"").replace(/[,:;]/g,".");

 if(!/^\d\.\d{1,2}$/.test(t))return null;

 return{g:q.toFixed(2),w:Math.abs(q-n)>.001}}
function parseWords(ws){

 let gs=[];T.forEach(w=>{const s=snap(w.t);if(s)gs.push({...w,...s})});
 if(gs.length>2){const xs=gs.map(g=>g.x).sort((a,b)=>a-b),mx=xs[xs.length>>1],mw=gs.map(g=>g.wd).sort((a,b)=>a-b)[gs.length>>1];gs=gs.filter(g=>Math.abs(g.x-mx)<mw*2.5)}
 gs.sort((a,b)=>a.y-b.y);
 const us=T.filter(w=>/^\d{1,2}$/.test(w.t)&&+w.t>0&&+w.t<=12),used=new Set(),out=[];
 gs.forEach(g=>{const c=us.filter(u=>u.x<g.x&&!used.has(u)&&Math.abs(u.y-g.y)<Math.max(g.h,u.h)*1.2).sort((a,b)=>Math.abs(a.y-g.y)-Math.abs(b.y-g.y))[0];
  if(c)used.add(c);out.push({n:"",u:c?c.t:"",g:g.g,w:g.w||!c})});
 const f=out.filter(r=>r.u).map(r=>r.u),m=f.sort((a,b)=>f.filter(v=>v===b).length-f.filter(v=>v===a).length)[0]||"3";
 out.forEach(r=>{if(!r.u)r.u=m});
